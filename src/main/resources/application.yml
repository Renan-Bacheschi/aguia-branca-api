spring:
  application:
    name: aguia-branca-api
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/aguia_branca}
  data:
    mongodb:
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  ai-analysis:
    enabled: ${AI_ANALYSIS_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
