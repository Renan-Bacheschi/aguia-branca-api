services:
  mongodb:
    image: mongo:8
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: aguia-branca-api:${IMAGE_TAG:-dev}
    build: .
    environment:
      MONGODB_URI: mongodb://mongodb:27017/aguia_branca
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatoria}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AI_ANALYSIS_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_net

volumes:
  mongodb_data:

networks:
  app_net: